services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ./server
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./server:/var/www/html
      # Baseline cho server/db/setup.php (chỉ đọc).
      - ./database:/var/www/database:ro
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ORDER_STORAGE_MODE: ${ORDER_STORAGE_MODE:-disabled}
      CLIENT_URL: ${CLIENT_URL}
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL}
      BANK_TRANSFER_BIN: ${BANK_TRANSFER_BIN:-}
      BANK_TRANSFER_ACCOUNT_NO: ${BANK_TRANSFER_ACCOUNT_NO:-}
      BANK_TRANSFER_ACCOUNT_NAME: ${BANK_TRANSFER_ACCOUNT_NAME:-}
      CHECKOUT_SHIPPING_VND: ${CHECKOUT_SHIPPING_VND:-}
      CHECKOUT_FREE_SHIPPING_MIN_VND: ${CHECKOUT_FREE_SHIPPING_MIN_VND:-}
      STORE_NAME: ${STORE_NAME:-HomeCare}
      STORE_ADDRESS: ${STORE_ADDRESS:-}
      STORE_PHONE: ${STORE_PHONE:-}
    ports:
      - "8080:80"
    depends_on:
      - db

  reminders:
    build:
      context: ./server
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./server:/var/www/html
      # Baseline để setup.php kiểm tra trạng thái migration trước khi gửi nhắc lịch.
      - ./database:/var/www/database:ro
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ORDER_STORAGE_MODE: mysql
    command: >-
      sh -c 'while true; do
        if php db/setup.php status --database="$$DB_NAME" >/dev/null 2>&1; then
          if php scripts/send-reminders.php; then sleep 86400; else sleep 300; fi;
        else
          echo "Reminder job waits for database migrations"; sleep 300;
        fi;
      done'
    depends_on:
      db:
        condition: service_healthy

  client:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./client:/app
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  mysql_data:
